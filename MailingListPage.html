
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mailing List - UoNavigate</title>
    <link rel="stylesheet" href="Styling/MailingListPageStyle.css">
    <link rel="icon" href="logo.png">
</head>

<body>

  <header>
    <a href="index.html">
      <img src="logo.png" alt="Uo Navigate logo">
    </a>

    <div>
      <h1>Uo Navigate</h1>
      <p class="tagline">CAMPUS IN 3D</p>
    </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="FeaturesPage.html">Features</a>
            <a href="PricingPage.html">Pricing</a>
            <a href="AboutTheTeamPage.html">About the Team</a>
            <a href="MailingListPage.html">Mailing List</a>
        </nav>
    </header>

    <main>
        <section id="mailing-list">

            <h1>Stay Updated with UoNavigate</h1>

            <p>
                Be the first to know about new campus locations,
                special events, and helpful student resources.
            </p>

            <h2>Join Our Mailing List</h2>

            <form>
                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="first-name" required>

                <br><br>

                <label for="last-name">Last Name:</label>
                <input type="text" id="last-name" name="last-name" required>

                <br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <br><br>

                <button type="submit">Sign Up</button>
                <p id="form-message" role="status" aria-live="polite"></p>
            <form id="signup-form" novalidate>

        </section>
    </main>

<script src="Scripts/MailingListPageScript.js"></script>
</body>
</html>
